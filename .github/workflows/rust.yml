name: Rust

on:
  push:
    branches: master
  pull_request:
    branches: master
  merge_group:
    branches: master

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    - name: Rustfmt
      run: cargo fmt --all -- --check
    - name: clippy
      run: cargo clippy --workspace -- -D warnings
    - name: clippy no-std
      run: cargo clippy --workspace --no-default-features --all-targets -- -D warnings
    - name: clippy with normal features
      run: cargo clippy --workspace --features std,scale,serde --all-targets -- -D warnings
    - name: clippy with ruint
      run: cargo clippy --workspace --features ruint --all-targets -- -D warnings

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Build
      run: cargo build --verbose
    - name: Build no-std
      run: cargo build --no-default-features
    - name: Build all-features
      run: cargo build --workspace --features std,scale,serde
    - name: Build ruint
      run: cargo build --workspace --features ruint

  semver:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install cargo-semver-checks
      run: cargo install cargo-semver-checks --locked
    - name: SemVer evm-interpreter
      run: cargo semver-checks --default-features -p evm-interpreter
    - name: SemVer evm
      run: cargo semver-checks --default-features -p evm
    - name: SemVer evm-precompile
      run: cargo semver-checks --default-features -p evm-precompile
    - name: SemVer evm-mainnet
      run: cargo semver-checks --default-features -p evm-mainnet

  tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    - name: Run main tests
      run: cargo test --all --release --verbose
    - name: Run ruint tests.
      run: cargo test --all --release --verbose --features ruint

  cancun-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v5
    - name: Cache pinned Cancun fixtures
      id: cache-cancun-fixtures
      uses: actions/cache@v4
      with:
        path: .cache/eels-fixtures/tests-v20.0.1
        key: eels-fixtures-tests-v20.0.1-3586193db06d4d5745d5e90b3c3008c2255a4e19ccd8f11a3ce887aec8c0b17c
    - name: Download and verify pinned Cancun fixtures
      if: steps.cache-cancun-fixtures.outputs.cache-hit != 'true'
      env:
        FIXTURE_URL: https://github.com/ethereum/execution-specs/releases/download/tests%40v20.0.1/fixtures.tar.gz
        FIXTURE_SHA256: 3586193db06d4d5745d5e90b3c3008c2255a4e19ccd8f11a3ce887aec8c0b17c
      run: |
        mkdir -p .cache/eels-fixtures/tests-v20.0.1
        curl --fail --location --retry 3 --output fixtures.tar.gz "$FIXTURE_URL"
        echo "$FIXTURE_SHA256  fixtures.tar.gz" | sha256sum --check --strict
        tar --extract --gzip --file fixtures.tar.gz \
          --directory .cache/eels-fixtures/tests-v20.0.1 \
          --wildcards \
          fixtures/.meta/index.json \
          'fixtures/state_tests/for_cancun/*'
    - name: Run all pinned Cancun state tests
      run: >-
        cargo run --release -p spectests --
        --fixtures .cache/eels-fixtures/tests-v20.0.1/fixtures
        --target Cancun

  time-consuming-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    - name: Run time consuming tests.
      run: cargo test --all --release --verbose --features time-consuming
